    <path d="M6.9 11.1c4-2.6 7.1-3.9 10.2-4.4" stroke-width="1.5" opacity="0.55"/>
    <path d="M6.9 12.9c4 2.6 7.1 3.9 10.2 4.4" stroke-width="1.5" opacity="0.55"/>
    <path d="M6.6 10.9c4.4-1.2 8.2-1.2 11 .4" stroke-width="2.4"/>
